version: "3"

tasks:
  install:
    desc: Install dependencies
    cmds:
      - pnpm install

  dev:
    desc: Start development server
    cmds:
      - pnpm dev

  tsc:
    desc: Type check
    cmds:
      - pnpm tsc --noEmit {{.CLI_ARGS}}

  lint:
    desc: Run ESLint
    cmds:
      - pnpm lint {{.CLI_ARGS}}

  format:
    desc: Format code with Prettier
    cmds:
      - pnpm format

  format:check:
    desc: Check code formatting
    cmds:
      - pnpm format:check

  test:iwft:install:
    desc: Install Playwright browsers
    cmds:
      - pnpm exec playwright install --with-deps chromium

  test:iwft:
    desc: Run isolated whole frontend tests
    cmds:
      - pnpm exec playwright test -c playwright-ct.config.ts {{.CLI_ARGS}}

  test:iwft:ui:
    desc: Run isolated whole frontend tests with UI
    cmds:
      - pnpm exec playwright test -c playwright-ct.config.ts --ui {{.CLI_ARGS}}

  test:unit:
    desc: Run unit tests
    cmds:
      - pnpm vitest run {{.CLI_ARGS}}

  coverage:unit:
    desc: Run unit tests with coverage
    cmds:
      - pnpm vitest run --coverage

  coverage:iwft:
    desc: Run IWFTs with coverage
    cmds:
      - COVERAGE=true pnpm test:iwft

  coverage:merge:
    desc: Merge unit and IWFT coverage reports
    cmds:
      - pnpm exec tsx scripts/merge-coverage.ts

  coverage:
    desc: Run all tests with coverage and merge reports
    cmds:
      - rm -rf coverage
      - task: coverage:unit
      - task: coverage:iwft
      - task: coverage:merge

  stryker:
    desc: Run mutation testing with Stryker
    cmds:
      - pnpm exec stryker run {{.CLI_ARGS}}

  build:
    desc: Build the project
    cmds:
      - pnpm build {{.CLI_ARGS}}

  analyze:
    desc: Build and analyze bundle size
    cmds:
      - ANALYZE=true pnpm build
      - echo Bundle analysis written to dist/stats.html

  knip:
    desc: Find unused code
    cmds:
      - pnpm exec knip {{.CLI_ARGS}}

  knip:prod:
    desc: Find unused code (production only, ignores test usage)
    cmds:
      - pnpm exec knip --production {{.CLI_ARGS}}

  check:
    desc: Run all checks (tsc, lint, format, tests)
    cmds:
      - task: tsc
      - task: infra:tsc
      - task: lint
      - task: format:check
      - task: test:unit
      - task: test:iwft

  ngrok:
    desc: Expose local dev server via ngrok
    cmds:
      - ngrok http 5173

  security:
    desc: Run trivy security scan
    cmds:
      - trivy fs --ignorefile .trivyignore.yaml --skip-version-check --include-dev-deps .

  secrets:
    desc: Scan for secrets with gitleaks
    cmds:
      - gitleaks detect --source . -v

  update-screenshots:
    aliases:
      - us
    desc: Trigger GitHub Actions workflow to update snapshots
    cmds:
      - gh workflow run update-snapshots.yml --ref main
      - sleep 2
      - GH_PAGER= gh run list --workflow=update-snapshots.yml --limit=1 --json url --jq '.[0].url'

  infra:install:
    desc: Install infrastructure dependencies
    dir: infra
    cmds:
      - pnpm install

  infra:tsc:
    desc: Type check infrastructure code
    dir: infra
    cmds:
      - pnpm tsc --noEmit {{.CLI_ARGS}}

  infra:preview:
    desc: Preview infrastructure changes
    dir: infra
    cmds:
      - pulumi preview --stack prod {{.CLI_ARGS}}

  infra:up:
    desc: Apply infrastructure changes
    dir: infra
    cmds:
      - pulumi up --stack prod --yes {{.CLI_ARGS}}
