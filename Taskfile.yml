version: "3"

tasks:
  install:
    desc: Install dependencies
    cmds:
      - pnpm install

  # Game app tasks
  game:dev:
    desc: Start game development server
    dir: apps/game
    cmds:
      - pnpm dev

  game:tsc:
    desc: Type check game
    dir: apps/game
    cmds:
      - pnpm tsc {{.CLI_ARGS}}

  game:lint:
    desc: Run ESLint on game
    dir: apps/game
    cmds:
      - pnpm lint {{.CLI_ARGS}}

  game:build:
    desc: Build game
    dir: apps/game
    cmds:
      - pnpm build {{.CLI_ARGS}}

  game:test:iwft:install:
    desc: Install Playwright browsers
    dir: apps/game
    cmds:
      - pnpm exec playwright install --with-deps chromium

  game:test:iwft:
    desc: Run isolated whole frontend tests
    dir: apps/game
    cmds:
      - pnpm exec playwright test -c playwright-ct.config.ts {{.CLI_ARGS}}

  game:test:iwft:ui:
    desc: Run isolated whole frontend tests with UI
    dir: apps/game
    cmds:
      - pnpm exec playwright test -c playwright-ct.config.ts --ui {{.CLI_ARGS}}

  game:test:unit:
    desc: Run unit tests
    dir: apps/game
    cmds:
      - pnpm vitest run {{.CLI_ARGS}}

  game:coverage:unit:
    desc: Run unit tests with coverage
    dir: apps/game
    cmds:
      - pnpm vitest run --coverage

  game:coverage:iwft:
    desc: Run IWFTs with coverage
    dir: apps/game
    cmds:
      - COVERAGE=true pnpm test:iwft

  game:coverage:merge:
    desc: Merge unit and IWFT coverage reports
    dir: apps/game
    cmds:
      - pnpm exec tsx scripts/merge-coverage.ts

  game:coverage:
    desc: Run all tests with coverage and merge reports
    cmds:
      - rm -rf coverage
      - task: game:coverage:unit
      - task: game:coverage:iwft
      - task: game:coverage:merge

  game:stryker:
    desc: Run mutation testing with Stryker
    dir: apps/game
    cmds:
      - pnpm exec stryker run {{.CLI_ARGS}}

  game:analyze:
    desc: Build and analyze bundle size
    dir: apps/game
    cmds:
      - ANALYZE=true pnpm build
      - echo Bundle analysis written to dist/stats.html

  game:knip:
    desc: Find unused code
    dir: apps/game
    cmds:
      - pnpm exec knip {{.CLI_ARGS}}

  game:knip:prod:
    desc: Find unused code (production only, ignores test usage)
    dir: apps/game
    cmds:
      - pnpm exec knip --production {{.CLI_ARGS}}

  game:ngrok:
    desc: Expose local dev server via ngrok
    cmds:
      - ngrok http 5173

  game:check:
    desc: Run all checks for game (tsc, lint, tests)
    cmds:
      - task: game:tsc
      - task: game:lint
      - task: game:test:unit
      - task: game:test:iwft

  # Shared package tasks
  shared:tsc:
    desc: Type check shared package
    dir: packages/shared
    cmds:
      - pnpm tsc {{.CLI_ARGS}}

  shared:lint:
    desc: Run ESLint on shared package
    dir: packages/shared
    cmds:
      - pnpm lint {{.CLI_ARGS}}

  shared:check:
    desc: Run all checks for shared package (tsc, lint)
    cmds:
      - task: shared:tsc
      - task: shared:lint

  # UI package tasks
  ui:tsc:
    desc: Type check UI package
    dir: packages/ui
    cmds:
      - pnpm tsc {{.CLI_ARGS}}

  ui:lint:
    desc: Run ESLint on UI package
    dir: packages/ui
    cmds:
      - pnpm lint {{.CLI_ARGS}}

  ui:check:
    desc: Run all checks for UI package (tsc, lint)
    cmds:
      - task: ui:tsc
      - task: ui:lint

  # Admin app tasks
  admin:dev:
    desc: Start admin development server
    dir: apps/admin
    cmds:
      - pnpm dev

  admin:tsc:
    desc: Type check admin
    dir: apps/admin
    cmds:
      - pnpm tsc {{.CLI_ARGS}}

  admin:lint:
    desc: Run ESLint on admin
    dir: apps/admin
    cmds:
      - pnpm lint {{.CLI_ARGS}}

  admin:build:
    desc: Build admin
    dir: apps/admin
    cmds:
      - pnpm build {{.CLI_ARGS}}

  admin:test:
    desc: Run admin unit tests
    dir: apps/admin
    cmds:
      - pnpm test {{.CLI_ARGS}}

  admin:check:
    desc: Run all checks for admin (tsc, lint, test)
    cmds:
      - task: admin:tsc
      - task: admin:lint
      - task: admin:test

  admin:db:generate:
    desc: Generate a new migration from schema changes
    dir: apps/admin
    cmds:
      - pnpm drizzle-kit generate {{.CLI_ARGS}}

  admin:db:migrate:dev:
    desc: Run migrations on dev database
    dir: apps/admin
    env:
      DATABASE_URL:
        sh: cd ../../infra && pulumi stack output devDatabaseUrl --show-secrets --stack prod
    cmds:
      - pnpm drizzle-kit migrate

  admin:db:migrate:prod:
    desc: Run migrations on prod database
    dir: apps/admin
    env:
      DATABASE_URL:
        sh: cd ../../infra && pulumi stack output prodDatabaseUrl --show-secrets --stack prod
    cmds:
      - pnpm drizzle-kit migrate

  admin:db:seed:dev:
    desc: Seed species data to dev database from data.wortle.app
    dir: apps/admin
    env:
      DATABASE_URL:
        sh: cd ../../infra && pulumi stack output devDatabaseUrl --show-secrets --stack prod
    cmds:
      - pnpm exec tsx scripts/seed-species.ts {{.CLI_ARGS}}

  admin:db:seed:prod:
    desc: Seed species data to prod database from data.wortle.app
    dir: apps/admin
    env:
      DATABASE_URL:
        sh: cd ../../infra && pulumi stack output prodDatabaseUrl --show-secrets --stack prod
    cmds:
      - pnpm exec tsx scripts/seed-species.ts {{.CLI_ARGS}}

  # Shared tasks
  format:
    desc: Format code with Prettier
    cmds:
      - pnpm format

  format:check:
    desc: Check code formatting
    cmds:
      - pnpm format:check

  check:
    desc: Run all checks (tsc, lint, format, tests)
    cmds:
      - task: sherif
      - task: shared:check
      - task: ui:check
      - task: game:check
      - task: admin:check
      - task: infra:check
      - task: format:check

  update-screenshots:
    aliases:
      - us
    desc: Trigger GitHub Actions workflow to update snapshots
    cmds:
      - gh workflow run update-snapshots.yml --ref main
      - sleep 2
      - GH_PAGER= gh run list --workflow=update-snapshots.yml --limit=1 --json url --jq '.[0].url'

  security:
    desc: Run trivy security scan
    cmds:
      - trivy fs --ignorefile .trivyignore.yaml --skip-version-check --include-dev-deps .

  secrets:
    desc: Scan for secrets with gitleaks
    cmds:
      - gitleaks detect --source . -v

  sherif:
    desc: Check monorepo dependency consistency
    cmds:
      - pnpm sherif

  infra:tsc:
    desc: Type check infrastructure code
    dir: infra
    cmds:
      - pnpm tsc {{.CLI_ARGS}}

  infra:lint:
    desc: Run ESLint on infrastructure code
    dir: infra
    cmds:
      - pnpm lint {{.CLI_ARGS}}

  infra:check:
    desc: Run all checks for infra (tsc, lint)
    cmds:
      - task: infra:tsc
      - task: infra:lint

  infra:preview:
    desc: Preview infrastructure changes
    dir: infra
    cmds:
      - pulumi preview --stack prod {{.CLI_ARGS}}

  infra:up:
    desc: Apply infrastructure changes
    dir: infra
    cmds:
      - pulumi up --stack prod --yes {{.CLI_ARGS}}
