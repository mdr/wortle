repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm prettier --write --ignore-unknown
        language: system
        types: [text]
        stages: [pre-commit]
      - id: tsc
        name: tsc
        entry: pnpm tsc
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: eslint-game
        name: eslint (game)
        entry: bash -c 'cd apps/game && pnpm eslint --no-warn-ignored --max-warnings=0 "${@/apps\/game\//}"' _
        language: system
        files: ^apps/game/
        types_or: [ts, tsx]
        stages: [pre-commit]
      - id: eslint-admin
        name: eslint (admin)
        entry: bash -c 'cd apps/admin && pnpm eslint --no-warn-ignored --max-warnings=0 "${@/apps\/admin\//}"' _
        language: system
        files: ^apps/admin/
        types_or: [ts, tsx]
        stages: [pre-commit]
      - id: eslint-shared
        name: eslint (shared)
        entry: bash -c 'cd packages/shared && pnpm eslint --no-warn-ignored --max-warnings=0 "${@/packages\/shared\//}"' _
        language: system
        files: ^packages/shared/
        types_or: [ts, tsx]
        stages: [pre-commit]
      - id: eslint-ui
        name: eslint (ui)
        entry: bash -c 'cd packages/ui && pnpm eslint --no-warn-ignored --max-warnings=0 "${@/packages\/ui\//}"' _
        language: system
        files: ^packages/ui/
        types_or: [ts, tsx]
        stages: [pre-commit]
      - id: eslint-infra
        name: eslint (infra)
        entry: bash -c 'cd infra && pnpm eslint --no-warn-ignored --max-warnings=0 "${@/infra\//}"' _
        language: system
        files: ^infra/
        types_or: [ts, tsx]
        stages: [pre-commit]
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged -v
        language: system
        pass_filenames: false
        stages: [pre-commit]
