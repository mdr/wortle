name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if update screenshots mode
        id: check-us
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == US* ]]; then
            echo "update_screenshots=true" >> $GITHUB_OUTPUT
          else
            echo "update_screenshots=false" >> $GITHUB_OUTPUT
          fi

      - name: Check flake health
        uses: DeterminateSystems/flake-checker-action@main
        with:
          check-outdated: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Setup devShell
        uses: nicknovitski/nix-develop@v1

      - name: Install dependencies
        run: task install

      - name: Type check
        run: task tsc

      - name: Type check infra
        run: task infra:tsc

      - name: Lint
        run: task lint

      - name: Check formatting
        run: task format:check

      - name: Install Playwright browsers
        run: task test:iwft:install

      - name: Isolated whole frontend tests
        id: test-iwft
        run: task test:iwft
        continue-on-error: ${{ steps.check-us.outputs.update_screenshots == 'true' }}

      - name: Update snapshots if tests failed
        if: steps.check-us.outputs.update_screenshots == 'true' && steps.test-iwft.outcome == 'failure'
        run: pnpm test:iwft --update-snapshots

      - name: Commit updated snapshots
        if: steps.check-us.outputs.update_screenshots == 'true' && steps.test-iwft.outcome == 'failure'
        run: |
          git add apps/game/src/tests/playwright/snapshots
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
          else
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "Update IWFT snapshots"
            git push
          fi

      - name: Re-run IWFTs after snapshot update
        if: steps.check-us.outputs.update_screenshots == 'true' && steps.test-iwft.outcome == 'failure'
        run: task test:iwft

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/game/playwright-report/
          retention-days: 7

      - name: Notify Vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: CI
