packages:
  - apps/*
  - packages/*
  - infra

allowBuilds:
  "@pulumi/neon": false
  esbuild: false
  protobufjs: false
  sharp: true
  tls-impersonate: false

overrides:
  # typed-rest-client (via Stryker) pins qs 6.15.1, which has DoS CVEs fixed in 6.16
  typed-rest-client>qs: 6.16.1

catalog:
  "@tanstack/react-query": 5.107.1
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  clsx: 2.1.1
  effect: 4.1.2
  eslint: 10.14.0
  jest-extended: 7.0.0
  lucide-react: 1.70.0
  mockttp: 4.6.5
  prettier: 3.9.10
  prettier-plugin-tailwindcss: 0.8.1
  react: 19.3.1
  react-dom: 19.3.1
  tailwind-merge: 3.7.0
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vitest: 5.1.0
  zod: 4.6.7
